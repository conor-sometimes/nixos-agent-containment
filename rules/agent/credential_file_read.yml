title: Contained agent reads a credential file
id: 2eaef911-26d1-4c33-b627-1380cdcdcdad
status: experimental
description: >
  A contained agent executed a program that reads a secret directly: private SSH keys, the shadow
  file, a git credential store, cloud or token files. The egress wall stops exfiltration; this
  catches the attempt, which is the signal that an agent has gone sideways. Watch files cover
  writes to these paths; this rule covers reads via a spawned program (cat/less/head/xxd/base64).
references:
  - https://github.com/conor-sometimes/nixos-agent-containment
author: nixos-agent-containment
date: 2026-10-13
logsource:
  product: linux
  category: process_creation
detection:
  reader:
    Image|endswith:
      - /cat
      - /less
      - /more
      - /head
      - /tail
      - /xxd
      - /od
      - /strings
      - /base64
  secret_path:
    CommandLine|contains:
      - /.ssh/id_
      - id_ed25519
      - id_rsa
      - /etc/shadow
      - .git-credentials
      - /.config/gh/hosts.yml
      - /.aws/credentials
      - .netrc
      - /.gnupg/
  condition: reader and secret_path
falsepositives:
  - An agent legitimately managing its OWN ~/.ssh (authorized_keys); scope the watch to others' paths.
level: high
