title: Contained agent tries to escalate privileges
id: 66c956f8-8c2b-4e7e-98c1-f68a49419ead
status: experimental
description: >
  A contained agent ran sudo, su, doas, pkexec or run0. The agent is never in wheel and has no
  password, so every attempt fails; the attempt itself is the signal: either a task went wrong in a
  way worth reading, or the agent is probing for a way out. (The exec rule records it under the
  agent's own exec key: auditd tags an event with the first matching rule, so the sudo watch only
  covers other users.)
references:
  - https://github.com/conor-sometimes/nixos-agent-containment
author: nixos-agent-containment
date: 2026-10-16
logsource:
  product: linux
  category: process_creation
detection:
  escalate:
    Image|endswith:
      - /sudo
      - /su
      - /doas
      - /pkexec
      - /run0
  condition: escalate
falsepositives:
  - A tool that probes for sudo before falling back (some installers run 'sudo -n true'); the
    command line shows it.
level: high
